<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn to Read the Clock</title>
<!-- Lets the iPad "Add to Home Screen" open it full screen, like an app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Learn Clock">
<meta name="theme-color" content="#f4f7ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --hour: #e63946;
    --hour-soft: #ffe3e6;
    --minute: #1d6fd8;
    --minute-soft: #e1eeff;
    --ink: #2b2d42;
    --muted: #6b7280;
    --paper: #ffffff;
    --bg: #f4f7ff;
    --ok: #1f9d55;
    --bad: #d62828;
    --star: #e5a100;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    padding: 14px;
    font-family: "Arial Rounded MT Bold", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.35;
    /* on a touch screen: no grey tap flash, no text selection or pop-up menu on a long press */
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  button { touch-action: manipulation; }   /* quick taps never zoom the page */
  .layout {
    display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: flex-start;
    max-width: 1120px; margin: 0 auto;
  }
  .clock-wrap { flex: 1 1 380px; max-width: 560px; }
  #clock {
    width: 100%; height: auto; display: block;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #clock .hand { cursor: grab; }
  #clock.dragging, #clock.dragging .hand { cursor: grabbing; }
  #clock .num {
    font-family: inherit; font-weight: 700; pointer-events: none;
    paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round;
  }
  #clock .num.min { font-size: 21px; fill: var(--minute); }
  #clock .num.hour { font-size: 36px; fill: var(--hour); }
  #clock .num.lit { fill: #fff; stroke: none; }
  #clock .hl { opacity: 0; transition: opacity .15s; }
  #clock .hl.on { opacity: 1; }

  .panel { flex: 1 1 320px; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--paper); border-radius: 18px; padding: 14px 16px; box-shadow: 0 4px 14px rgba(43,45,66,.08); }
  .card h2 {
    margin: 0 0 8px; font-size: .95rem; color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em;
  }

  /* digital time */
  .digital { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 14px; }
  .digit-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .digit-group small { font-size: .9rem; font-weight: 700; }
  .digit-group.h small { color: var(--hour); }
  .digit-group.m small { color: var(--minute); }
  /* the numbers are not typed into: they change with ▲ ▼ or by swiping up and down on them */
  .digit {
    display: flex; align-items: center; justify-content: center;
    width: 112px; height: 92px; line-height: 1;
    font-size: 64px; font-weight: 700;
    border: 4px solid; border-radius: 16px; background: #fff;
    touch-action: none; cursor: ns-resize;
  }
  .digit:empty::before { content: "?"; color: #c7cbd8; }
  .digit.swiping { box-shadow: 0 0 0 4px rgba(29,111,216,.25); }
  .digit.h { border-color: var(--hour); color: var(--hour); }
  .digit.m { border-color: var(--minute); color: var(--minute); }
  body[data-mode="set"] .digit { background: #f5f6fa; cursor: default; }
  .colon { font-size: 64px; font-weight: 700; padding-bottom: 28px; }
  .step {
    width: 80px; height: 52px; border: 0; border-radius: 12px; background: #eef1f8;
    font-size: 20px; cursor: pointer; color: var(--ink);
  }
  .step:hover { background: #dfe5f3; }
  .step:disabled { opacity: .3; cursor: default; }
  b.h { color: var(--hour); }
  b.m { color: var(--minute); }

  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button.big {
    font: inherit; font-size: 1rem; font-weight: 700; padding: 10px 16px;
    border: 0; border-radius: 12px; cursor: pointer; background: #eef1f8; color: var(--ink);
  }
  button.big:hover { background: #dfe5f3; }
  button.big.primary { background: var(--minute); color: #fff; }
  button.big.primary:hover { background: #185fba; }
  button.big.active { background: var(--ink); color: #fff; }

  /* quiz */
  .quiz .prompt { font-size: 1.1rem; margin: 12px 0; text-align: center; min-height: 1.4em; }
  .quiz .result { text-align: center; font-size: 1.15rem; font-weight: 700; margin: 10px 0 4px; min-height: 1.4em; }
  .quiz .result.ok { color: var(--ok); }
  .quiz .result.bad { color: var(--bad); }
  .score { text-align: center; font-size: 1.2rem; margin-top: 6px; color: var(--star); font-weight: 700; min-height: 1.4em; letter-spacing: 2px; }
  .score .empty { filter: grayscale(1); opacity: .3; }   /* stars still to win */
  .score .trophies { margin-left: 14px; letter-spacing: 0; }
  body[data-mode="free"] .quiz-only { display: none; }

  /* the "You won!" screen after 5 stars */
  .win {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(43,45,66,.45);
  }
  .win[hidden] { display: none; }
  .win-card {
    width: 100%; max-width: 340px; padding: 24px 28px; text-align: center;
    background: var(--paper); border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,.25);
    animation: pop .4s ease-out;
  }
  .win-cup { font-size: 80px; line-height: 1; }
  .win-card h2 { margin: 8px 0 4px; font-size: 2rem; }
  .win-card p { margin: 0 0 8px; font-size: 1.1rem; }
  .win-trophies { font-size: 1.6rem; margin-bottom: 16px; }
  .win .big { font-size: 1.2rem; padding: 12px 26px; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .confetti { position: fixed; top: -14px; z-index: 11; width: 10px; height: 14px; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) {
    .confetti { display: none; }
    .win-card { animation: none; }
  }

  /* iPad held upright: a big clock on top and the two cards side by side underneath, all on one screen */
  @media (orientation: portrait) and (min-width: 700px) {
    .layout { flex-direction: column; align-items: center; }
    .clock-wrap { flex: none; max-width: none; width: min(100%, max(360px, calc(100vh - 520px))); }
    @supports (height: 100svh) {
      .clock-wrap { width: min(100%, max(360px, calc(100svh - 520px))); }
    }
    .panel { flex: none; flex-direction: row; align-items: flex-start; width: 100%; max-width: none; }
    .panel .card { flex: 1 1 0; }
  }

  /* Phones: everything on one screen, so the clock and the game buttons are always in view together.
     The cards are dropped and their contents re-ordered: game buttons, clock, time, game, then the tools. */
  @media (max-width: 600px) and (orientation: portrait), (max-height: 500px) and (orientation: landscape) {
    body { padding: 8px 12px; }
    .panel { gap: 8px; }
    .panel .card { display: contents; }
    .card h2, .mode .long { display: none; }
    .modes { order: -1; flex-wrap: nowrap; gap: 6px; }
    .tools { order: 1; }
    button.big { padding: 8px 12px; font-size: .95rem; }
    button.big.mode { flex: 1 1 0; padding: 9px 4px; white-space: nowrap; }

    /* the time on one row: ▼ 10 ▲ : ▼ 20 ▲ */
    .digital { margin: 0; gap: 4px; }
    .digit-group { display: grid; grid-template-areas: "down num up" ". label ."; align-items: center; gap: 2px 4px; }
    .digit-group .step[data-d="-1"] { grid-area: down; }
    .digit-group .step[data-d="1"] { grid-area: up; }
    .digit-group .digit { grid-area: num; }
    .digit-group small { grid-area: label; text-align: center; font-size: .8rem; }
    .digit { width: 66px; height: 58px; font-size: 40px; border-width: 3px; border-radius: 12px; }
    .step { width: 44px; height: 58px; font-size: 16px; }
    .colon { font-size: 40px; padding-bottom: 20px; }

    .quiz .prompt { font-size: 1rem; margin: 0 0 8px; }
    .quiz .result { font-size: 1rem; margin: 6px 0 0; }
    .score { font-size: 1rem; margin-top: 2px; }
  }
  /* upright phone: one column, with the clock as big as the space left over allows */
  @media (max-width: 600px) and (orientation: portrait) {
    .layout { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 8px; }
    .panel { display: contents; }
    .clock-wrap { flex: none; align-self: center; max-width: none; width: min(100%, max(200px, calc(100vh - 380px))); }
    @supports (height: 100svh) {
      .clock-wrap { width: min(100%, max(200px, calc(100svh - 380px))); }
    }
  }
  /* phone on its side: clock on the left, everything else on the right */
  @media (max-height: 500px) and (orientation: landscape) {
    .layout { flex-wrap: nowrap; align-items: center; gap: 16px; max-width: none; }
    /* the clock takes what is left beside the 344px-wide row of numbers (plus the 16px gap) */
    .clock-wrap { flex: none; max-width: none; width: min(calc(100vh - 16px), calc(100% - 360px)); }
    @supports (height: 100svh) {
      .clock-wrap { width: min(calc(100svh - 16px), calc(100% - 360px)); }
    }
    .panel { flex: 1 1 0; max-width: 440px; }
  }
</style>
</head>
<body data-mode="free">

<div class="layout">
  <div class="clock-wrap">
    <svg id="clock" viewBox="0 0 440 440" aria-label="Teaching clock. Drag the hands to change the time."></svg>
  </div>

  <div class="panel">
    <div class="card">
      <div class="digital">
        <div class="digit-group h">
          <button class="step" data-t="hour" data-d="1" aria-label="Hour up">▲</button>
          <div id="hourBox" class="digit h" aria-label="Hours"></div>
          <button class="step" data-t="hour" data-d="-1" aria-label="Hour down">▼</button>
          <small>hours</small>
        </div>
        <div class="colon">:</div>
        <div class="digit-group m">
          <button class="step" data-t="minute" data-d="1" aria-label="Minutes up">▲</button>
          <div id="minuteBox" class="digit m" aria-label="Minutes"></div>
          <button class="step" data-t="minute" data-d="-1" aria-label="Minutes down">▼</button>
          <small>minutes</small>
        </div>
      </div>
      <div class="row tools">
        <button class="big" id="speakBtn">🔊 Say the time</button>
        <button class="big" id="nowBtn">⏰ Time now</button>
      </div>
    </div>

    <div class="card quiz">
      <h2>Play</h2>
      <div class="row modes">
        <button class="big mode active" data-mode="free">✋ Free play</button>
        <button class="big mode" data-mode="read">👀 What time<span class="long"> is it</span>?</button>
        <button class="big mode" data-mode="set">🕑 Set <span class="long">the </span>clock</button>
      </div>
      <div class="quiz-only">
        <div class="prompt" id="prompt"></div>
        <div class="row">
          <button class="big primary" id="checkBtn">✓ Check</button>
          <button class="big" id="showBtn">👁 Show me</button>
          <button class="big" id="nextBtn">➜ Next</button>
        </div>
        <div class="result" id="result"></div>
        <div class="score" id="score"></div>
      </div>
    </div>
  </div>
</div>

<div class="win" id="win" hidden>
  <div class="win-card" role="dialog" aria-labelledby="winTitle">
    <div class="win-cup">🏆</div>
    <h2 id="winTitle">You won!</h2>
    <p id="winText"></p>
    <div class="win-trophies" id="winTrophies"></div>
    <button class="big primary" id="againBtn">▶ Play again</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('clock');
  const C = 220;   // centre of the 440x440 view box
  const R = {      // radii of the various rings, in view box units
    band: 216, face: 180, minNum: 198,
    tickOut: 174, tickMin: 166, tick5: 158,
    hourNum: 128, hourHand: 86, minHand: 150
  };
  const COLOR = { hour: '#e63946', minute: '#1d6fd8', minuteSoft: '#e1eeff', ink: '#2b2d42', tick: '#a3a9bd' };

  const STARS_TO_WIN = 5;
  // stars: this round's stars in the current game; trophies: rounds won since the app was opened
  const state = { hour: 2, minute: 10, mode: 'free', target: null, stars: 0, trophies: 0 };

  const $ = id => document.getElementById(id);
  const hourBox = $('hourBox');
  const minuteBox = $('minuteBox');
  const pad = n => String(n).padStart(2, '0');
  const wrapHour = h => ((h - 1) % 12 + 12) % 12 + 1;   // keeps hours in 1..12

  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  // Point at a given clockwise angle (degrees from 12 o'clock) and radius.
  function pos(deg, r) {
    const a = deg * Math.PI / 180;
    return { x: C + r * Math.sin(a), y: C - r * Math.cos(a) };
  }

  /* ---------- build the clock face ---------- */
  const face = el('g', {}, svg);
  const ring = el('g', { id: 'minuteRing' }, face);
  el('circle', { cx: C, cy: C, r: R.band, fill: COLOR.minuteSoft, stroke: COLOR.minute, 'stroke-width': 4 }, ring);
  el('circle', { cx: C, cy: C, r: R.face, fill: '#fff', stroke: COLOR.ink, 'stroke-width': 4 }, face);

  for (let i = 0; i < 60; i++) {
    const is5 = i % 5 === 0;
    const p1 = pos(i * 6, R.tickOut);
    const p2 = pos(i * 6, is5 ? R.tick5 : R.tickMin);
    el('line', {
      x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
      stroke: is5 ? COLOR.ink : COLOR.tick, 'stroke-width': is5 ? 4 : 2, 'stroke-linecap': 'round'
    }, face);
  }

  // Number labels live in their own layer, drawn after the hands, so a hand never hides the number it points at.
  const labels = el('g', {}, svg);
  const ringLabels = el('g', { id: 'minuteRingLabels' }, labels);
  const minLit = {};   // outer ring: [fill circle, text]
  const hourLit = {};  // inner ring: [fill circle (hour hand), outline circle (minute hand), text]
  for (let i = 1; i <= 12; i++) {
    const a = i * 30;
    const pm = pos(a, R.minNum);
    const cm = el('circle', { cx: pm.x, cy: pm.y, r: 18, fill: COLOR.minute, class: 'hl' }, ring);
    const tm = el('text', { x: pm.x, y: pm.y, dy: '0.36em', 'text-anchor': 'middle', class: 'num min' }, ringLabels);
    tm.textContent = i * 5;
    minLit[i] = [cm, tm];

    const ph = pos(a, R.hourNum);
    const ch = el('circle', { cx: ph.x, cy: ph.y, r: 25, fill: COLOR.hour, class: 'hl' }, face);
    const co = el('circle', { cx: ph.x, cy: ph.y, r: 25, fill: 'none', stroke: COLOR.minute, 'stroke-width': 4, class: 'hl' }, face);
    const th = el('text', { x: ph.x, y: ph.y, dy: '0.36em', 'text-anchor': 'middle', class: 'num hour' }, labels);
    th.textContent = i;
    hourLit[i] = [ch, co, th];
  }

  /* ---------- hands ---------- */
  const hands = el('g', {}, svg);
  svg.insertBefore(hands, labels);
  const hourHand = el('g', { id: 'hourHand', class: 'hand' }, hands);
  el('line', { x1: C, y1: C + 16, x2: C, y2: C - R.hourHand + 14, stroke: COLOR.hour, 'stroke-width': 14, 'stroke-linecap': 'round' }, hourHand);
  el('polygon', { points: `${C},${C - R.hourHand - 6} ${C - 12},${C - R.hourHand + 20} ${C + 12},${C - R.hourHand + 20}`, fill: COLOR.hour }, hourHand);

  const minuteHand = el('g', { id: 'minuteHand', class: 'hand' }, hands);
  el('line', { x1: C, y1: C + 18, x2: C, y2: C - R.minHand + 12, stroke: COLOR.minute, 'stroke-width': 9, 'stroke-linecap': 'round' }, minuteHand);
  el('polygon', { points: `${C},${C - R.minHand - 8} ${C - 10},${C - R.minHand + 18} ${C + 10},${C - R.minHand + 18}`, fill: COLOR.minute }, minuteHand);

  el('circle', { cx: C, cy: C, r: 11, fill: COLOR.ink }, hands);
  el('circle', { cx: C, cy: C, r: 4, fill: '#fff' }, hands);

  const minuteAngle = () => state.minute * 6;
  const hourAngle = () => (state.hour % 12) * 30 + state.minute * 0.5;   // the short hand creeps between the hours

  /* ---------- time as text ---------- */
  const ONES = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten',
    'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
  const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty'];
  const HOURS = ['twelve', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven'];

  function numWord(n) {
    if (n < 20) return ONES[n];
    const o = n % 10;
    return TENS[Math.floor(n / 10)] + (o ? '-' + ONES[o] : '');
  }
  const digits = (h, m) => `${h}:${pad(m)}`;
  // The time as the speech voice should say it: 3:45 is "three forty-five", 2:05 is "two oh five".
  function spokenTime(h, m) {
    const hw = HOURS[h % 12];
    if (m === 0) return `${hw} o'clock`;
    return `${hw} ${m < 10 ? 'oh ' : ''}${numWord(m)}`;
  }

  /* ---------- render ---------- */
  function render(syncBoxes) {
    hourHand.setAttribute('transform', `rotate(${hourAngle()} ${C} ${C})`);
    minuteHand.setAttribute('transform', `rotate(${minuteAngle()} ${C} ${C})`);

    // Which number does the long hand point at? (only when it sits exactly on one)
    const mp = state.minute % 5 === 0 ? (state.minute === 0 ? 12 : state.minute / 5) : 0;
    for (let i = 1; i <= 12; i++) {
      const litM = i === mp;
      const litH = i === state.hour;
      minLit[i][0].classList.toggle('on', litM);
      minLit[i][1].classList.toggle('lit', litM);
      hourLit[i][0].classList.toggle('on', litH);
      hourLit[i][1].classList.toggle('on', litM);
      hourLit[i][2].classList.toggle('lit', litH);
    }

    if (syncBoxes) { hourBox.textContent = state.hour; minuteBox.textContent = pad(state.minute); }
  }

  /* ---------- dragging the hands ---------- */
  function svgPoint(e) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  const angleOf = p => (Math.atan2(p.x - C, C - p.y) * 180 / Math.PI + 360) % 360;

  // Distance from a point to the hand drawn at `angle` with length `len`.
  function distToHand(p, angle, len) {
    const tip = pos(angle, len);
    const dx = tip.x - C, dy = tip.y - C;
    const t = Math.max(0, Math.min(1, ((p.x - C) * dx + (p.y - C) * dy) / (dx * dx + dy * dy)));
    return Math.hypot(p.x - (C + t * dx), p.y - (C + t * dy));
  }

  let dragging = null;   // 'hour' | 'minute' | null

  svg.addEventListener('pointerdown', e => {
    if (state.mode === 'read') return;           // the child must read the clock, not move it
    const p = svgPoint(e);
    const rad = Math.hypot(p.x - C, p.y - C);
    if (rad > R.band + 10) return;
    const dm = distToHand(p, minuteAngle(), R.minHand);
    const dh = distToHand(p, hourAngle(), R.hourHand);
    if (dh <= 40 && dh <= dm) dragging = 'hour';
    else if (dm <= 40) dragging = 'minute';
    else if (rad > R.hourHand + 20) dragging = 'minute';   // tapping near the edge grabs the long hand
    else return;
    e.preventDefault();
    svg.setPointerCapture(e.pointerId);
    svg.classList.add('dragging');
    moveTo(p);
  });
  svg.addEventListener('pointermove', e => { if (dragging) moveTo(svgPoint(e)); });
  const stopDrag = () => { dragging = null; svg.classList.remove('dragging'); };
  svg.addEventListener('pointerup', stopDrag);
  svg.addEventListener('pointercancel', stopDrag);

  function moveTo(p) {
    const a = angleOf(p);
    if (dragging === 'minute') {
      const m = Math.round(a / 30) * 5 % 60;   // the long hand jumps 5 minutes at a time
      const diff = m - state.minute;
      if (diff < -30) state.hour = wrapHour(state.hour + 1);      // passed 12 going forwards
      else if (diff > 30) state.hour = wrapHour(state.hour - 1);  // passed 12 going backwards
      state.minute = m;
    } else {
      let h = Math.round((a - state.minute * 0.5) / 30) % 12;
      state.hour = h <= 0 ? h + 12 : h;
    }
    render(state.mode === 'free');
  }

  /* ---------- the numbers: ▲ ▼ buttons, or swiping up and down on a number ---------- */
  function step(target, delta) {
    if (state.mode === 'set') return;
    if (state.mode === 'read') {   // in the quiz the buttons change the child's answer, not the clock
      const box = target === 'hour' ? hourBox : minuteBox;
      const v = parseInt(box.textContent, 10);   // NaN while the box still shows "?"
      if (target === 'hour') box.textContent = isNaN(v) ? (delta > 0 ? 1 : 12) : wrapHour(v + delta);
      else box.textContent = pad(isNaN(v) ? (delta > 0 ? 0 : 55) : ((v + delta * 5) % 60 + 60) % 60);
      return;
    }
    if (target === 'hour') {
      state.hour = wrapHour(state.hour + delta);
    } else {
      let m = (delta > 0 ? Math.floor(state.minute / 5) + 1 : Math.ceil(state.minute / 5) - 1) * 5;
      if (m >= 60) { m -= 60; state.hour = wrapHour(state.hour + 1); }
      else if (m < 0) { m += 60; state.hour = wrapHour(state.hour - 1); }
      state.minute = m;
    }
    render(true);
  }
  document.querySelectorAll('.step').forEach(b =>
    b.addEventListener('click', () => step(b.dataset.t, parseInt(b.dataset.d, 10))));

  // Swiping up on a number makes it bigger, swiping down makes it smaller: one step per SWIPE_STEP pixels.
  const SWIPE_STEP = 24;
  [[hourBox, 'hour'], [minuteBox, 'minute']].forEach(([box, target]) => {
    let lastY = null;
    box.addEventListener('pointerdown', e => {
      if (state.mode === 'set') return;
      e.preventDefault();
      lastY = e.clientY;
      box.setPointerCapture(e.pointerId);
      box.classList.add('swiping');
    });
    box.addEventListener('pointermove', e => {
      if (lastY === null) return;
      while (lastY - e.clientY >= SWIPE_STEP) { lastY -= SWIPE_STEP; step(target, 1); }
      while (e.clientY - lastY >= SWIPE_STEP) { lastY += SWIPE_STEP; step(target, -1); }
    });
    const endSwipe = () => { lastY = null; box.classList.remove('swiping'); };
    box.addEventListener('pointerup', endSwipe);
    box.addEventListener('pointercancel', endSwipe);
  });

  /* ---------- buttons ---------- */
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85;
    u.lang = 'en-US';
    speechSynthesis.speak(u);
  }
  $('speakBtn').addEventListener('click', () => {
    const revealed = state.mode === 'free' || document.body.classList.contains('revealed');
    if (!revealed) { speak(state.mode === 'read' ? 'Look at the clock. What time is it?' : 'Move the hands to show the time.'); return; }
    speak(spokenTime(state.hour, state.minute));
  });
  $('nowBtn').addEventListener('click', () => {
    if (state.mode !== 'free') setMode('free');
    const d = new Date();
    state.hour = d.getHours() % 12 || 12;
    state.minute = d.getMinutes();
    render(true);
  });

  /* ---------- quiz ---------- */
  function randomTime() {
    let t;
    do {
      t = {
        h: 1 + Math.floor(Math.random() * 12),
        m: 5 * Math.floor(Math.random() * 12)
      };
    } while (state.target && t.h === state.target.h && t.m === state.target.m || (t.h === 12 && t.m === 0));
    return t;
  }
  function showResult(text, cls) {
    const r = $('result');
    r.textContent = text;
    r.className = 'result ' + cls;
  }
  // A row of 5 stars that fill up as the child gets answers right, plus the trophies won so far.
  function updateScore() {
    let html = '';
    for (let i = 0; i < STARS_TO_WIN; i++) html += `<span${i < state.stars ? '' : ' class="empty"'}>⭐</span>`;
    if (state.trophies) html += `<span class="trophies">🏆 ${state.trophies}</span>`;
    $('score').innerHTML = html;
  }

  /* ---------- winning a round ---------- */
  let winTimer = null;
  function showWin() {
    const n = state.trophies;
    $('winText').textContent = `You got ${STARS_TO_WIN} stars. Well done!`;
    $('winTrophies').textContent = '🏆'.repeat(Math.min(n, 10)) + (n > 10 ? ' ' + n : '');
    $('win').hidden = false;
    confetti();
    $('againBtn').focus();
  }
  function hideWin() {
    clearTimeout(winTimer);
    $('win').hidden = true;
  }
  function confetti() {
    const colors = [COLOR.hour, COLOR.minute, '#e5a100', '#1f9d55', '#9b5de5'];
    for (let i = 0; i < 80; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 2 + Math.random() * 2 + 's';
      c.style.animationDelay = Math.random() * 0.6 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }
  $('againBtn').addEventListener('click', () => {
    hideWin();
    state.stars = 0;
    updateScore();
    nextQuestion();
  });

  function setMode(mode) {
    state.mode = mode;
    state.stars = 0;   // every game starts a fresh round
    hideWin();
    document.body.dataset.mode = mode;
    document.body.classList.remove('revealed');
    document.querySelectorAll('.mode').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    showResult('', '');
    document.querySelectorAll('.step').forEach(b => { b.disabled = mode === 'set'; });
    if (mode === 'free') {
      state.target = null;
      $('prompt').textContent = '';
      render(true);
    } else {
      nextQuestion();
    }
    updateScore();
  }
  function nextQuestion() {
    document.body.classList.remove('revealed');
    showResult('', '');
    const t = randomTime();
    state.target = t;
    if (state.mode === 'read') {
      state.hour = t.h; state.minute = t.m;
      hourBox.textContent = ''; minuteBox.textContent = '';
      $('prompt').innerHTML = 'Look at the clock. <b>What time is it?</b> Set the numbers with ▲ ▼, then press Check.';
    } else {
      state.hour = 12; state.minute = 0;
      hourBox.textContent = t.h; minuteBox.textContent = pad(t.m);
      $('prompt').innerHTML = `Drag the hands so the clock shows <b class="h">${t.h}</b>:<b class="m">${pad(t.m)}</b>, then press Check.`;
    }
    render(false);
  }
  function check() {
    if (state.mode === 'free') return;
    let ok;
    if (state.mode === 'read') {
      const h = parseInt(hourBox.textContent, 10), m = parseInt(minuteBox.textContent, 10);
      if (isNaN(h) || isNaN(m)) { showResult('Set the hour and the minutes first.', 'bad'); return; }
      ok = h === state.hour && m === state.minute;
    } else {
      ok = state.hour === state.target.h && state.minute === state.target.m;
    }
    if (ok) {
      const time = digits(state.hour, state.minute);
      if (document.body.classList.contains('revealed')) {   // answer was shown already: confirm, no star
        showResult(`That's right, it's ${time}. Press Next for a new one!`, 'ok');
        return;
      }
      state.stars++;
      document.body.classList.add('revealed');
      render(true);
      showResult(`⭐ Yes! It's ${time}.`, 'ok');
      const said = `Yes! It's ${spokenTime(state.hour, state.minute)}.`;
      if (state.stars >= STARS_TO_WIN) {
        state.trophies++;
        speak(`${said} You won! Well done!`);
        winTimer = setTimeout(showWin, 1200);   // let the last star and the "Yes!" show first
      } else {
        speak(said);
      }
      updateScore();
    } else {
      showResult(state.mode === 'read'
        ? 'Not quite. Look at the short hand first, then the long hand, and try again!'
        : 'Not quite. Check the short hand and the long hand, then try again!', 'bad');
    }
  }
  function showMe() {
    if (state.mode === 'free') return;
    if (state.mode === 'set') { state.hour = state.target.h; state.minute = state.target.m; }
    document.body.classList.add('revealed');
    render(true);
    showResult(`The answer is ${digits(state.hour, state.minute)}.`, '');
  }
  document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  $('checkBtn').addEventListener('click', check);
  $('showBtn').addEventListener('click', showMe);
  $('nextBtn').addEventListener('click', nextQuestion);

  render(true);

  // Saves the app on the device so it also opens without internet. Only works once it is on a website,
  // so opening the file straight from the computer carries on as before.
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
